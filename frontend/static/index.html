<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>LASEK – Map Explorer</title>
  <link rel="icon" href="/favicon.ico"/>

  <!-- OpenLayers CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@8.2.0/ol.css"/>

  <!-- App CSS -->
  <link rel="stylesheet" href="/style.css"/>

  <!-- INLINE LAYOUT + BACKGROUND FIXES -->
  <style>
    body {
      margin:0; padding:0;
      background: url('/blue-bg.jpg') no-repeat center center fixed;
      background-size: cover;
      font-family: sans-serif;
    }
    #root {
      display:flex; width:100%; height:100vh;
      margin:0; padding:0;
    }
    .app {
      display:flex; width:100%; height:100%;
    }
    .sidebar {
      width:300px;
      padding:10px; box-sizing:border-box;
      border-right:1px solid #ccc;
      background:transparent;
      overflow-y:auto;
      color:white;
    }
    .sidebar pre,
    .sidebar .suggestion {
      color:black;
    }
    .main {
      flex:1; position:relative;
      padding:20px;
    }
    #map {
      position:absolute;
      top:0; left:0; right:0; bottom:0;
      border:20px transparent/*solid rgba(255,255,255,0.8); */
    }
    #mapSpinner {
      position:absolute;
      top:50%; left:50%;
      transform:translate(-50%,-50%);
      font-size:2rem; color:white;
      z-index:10000; display:none;
    }
  </style>

  <!-- React & Babel (dev only) -->
  <script src="https://unpkg.com/react@17/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@17/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- OpenLayers JS -->
  <script src="https://cdn.jsdelivr.net/npm/ol@8.2.0/dist/ol.js"></script>

  <!-- FontAwesome -->
  <script src="https://kit.fontawesome.com/4ddd5e62e6.js" crossorigin="anonymous"></script>

  <!-- Helpers -->
  <script src="/custom_styles.js"></script>
  <script src="/formats.js"></script>
</head>
<body>
  <!-- Map loading spinner -->
  <div id="mapSpinner"><i class="fas fa-spinner fa-spin"></i></div>

  <!-- React root -->
  <div id="root">Loading application…</div>

  <!-- App code /// use app-old for simpler version -->
  <script type="text/babel" src="/app.js"></script>
</body>
</html>
